services:
  - type: web
    name: youtube-automation
    env: python
    envVars:
      - key: OUTPUT_DIR
        value: /tmp/youtube-automation/output
      - key: TEMP_DIR
        value: /tmp/youtube-automation/tmp
      - key: RETAIN_RUN_ARTIFACTS
        value: "1"
      - key: ENABLE_LONG_VIDEO
        value: "false"
      - key: ENABLE_BACKGROUND_MUSIC
        value: "false"
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
  - type: cron
    name: youtube-automation-daily
    env: python
    schedule: "0 5 * * *"
    envVars:
      - key: OUTPUT_DIR
        value: /tmp/youtube-automation/output
      - key: TEMP_DIR
        value: /tmp/youtube-automation/tmp
      - key: RETAIN_RUN_ARTIFACTS
        value: "1"
      - key: ENABLE_LONG_VIDEO
        value: "false"
      - key: ENABLE_BACKGROUND_MUSIC
        value: "false"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py full
